<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>limpidia · Era 2</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--tx:#e8e6e1;--mut:#8b8f98;--oro:#c9a227}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);
font:16px/1.45 -apple-system,system-ui,sans-serif;padding:14px}
h1{font-size:20px;margin:4px 0 2px}h1 b{color:var(--oro)}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.tot{font-size:13px;color:var(--mut);margin:0 0 14px}
.f{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:9px;
display:flex;gap:12px;align-items:flex-start;cursor:pointer;
border-left:4px solid #2a2f3a;transition:.15s}
.f.corso{border-left-color:var(--oro)}.f.fatta{border-left-color:#3fa66a;opacity:.75}
.chip{font-size:21px;line-height:1;margin-top:2px;min-width:26px;text-align:center}
.n{font-weight:700}.n small{color:var(--oro);font-weight:700;margin-right:6px}
.s{color:var(--mut);font-size:13px;margin-top:2px}
.nota{color:var(--mut);font-size:12px;margin-top:18px;text-align:center}
</style></head><body>
<h1>limpidia · <b>Era 2</b></h1>
<div class="sub">La codifica a spec congelate — tap su una fase per cambiarle stato.
Fonte di verità: <code>docs/fasi/piano-era2.md</code></div>
<div class="tot" id="tot"></div>
<div id="lista"></div>
<div class="nota">⬜ da fare · 🟡 in corso · ✅ fatta — lo stato vive solo su questo
telefono (localStorage). Il cancello vero resta la CI.</div>
<script>
const FASI=[
["S0","Bonifica e verità","020_bonifica (RLS riparazioni, igiene grant, registro migrazioni) + verifiche + diagnosi timeout + baseline CI"],
["B1","Fondamenta","consensi · relazioni · oculisti · parametri · assicurazioni · helper permessi · 4 contratti (anonimizzazione…)"],
["B2","Prescrizioni","scheda unica additive · prescrizioni_lac · funzioni pure conversioni · consenso per-Rx · rettifica"],
["B6","Agenda evoluta ⚡","tipo_visita · riprogramma · disdetta dal link + visita eliminata visibile · Apri Rx · parallelizzabile: priorità lancio"],
["B3","Catalogo & Magazzino","lac_modelli+producibilità · bolle attese · pratiche difetto · causali recupera_costo · valori doppi · inventario"],
["B4","Ordini & Laboratorio","tipi+provenienza · Rx immutabile · numerazione O/M/L/C-NNN · bolla alla caparra · catena stati · custodia · Ripeti"],
["B5","Cassa","vendita veloce + regola del CF · recupera-e-associa · sconto libero · liturgia chiusura (300±20, tondo) · apri/chiudi"],
["B7","Richiami","tarature · code (Rx→prenotazione) · gate consenso · copertura ÷2 · win-back · esiti"],
["B8","Semina & letture","semina guidata (-NNN, servizi+ProvaLAC, parametri) · filtro esaminatori · letture per operatore"],
["B9","Collaudo · C0","suite S completa cross-modulo · fixme riscritti · mappa+regole validate · verbale di chiusura"],
["X","Riassetto & merge","riordino repo · PR su main GitHub (sessione dedicata)"],
["Y","Innesti collega","UI-home · Applicazione LAC & Anamnesi (modulari, separata sede)"],
["Z","Fiscalità (MF)","coi commercialisti, a gestionale codato: RT · pareggio mensile · varianti fattura"]];
const K="limpidia-era2",st=JSON.parse(localStorage.getItem(K)||"{}"),
C=["⬜","🟡","✅"],CL=["","corso","fatta"];
function render(){const L=document.getElementById("lista");L.innerHTML="";let f=0;
FASI.forEach(([id,n,s])=>{const v=st[id]||0;if(v==2)f++;
const d=document.createElement("div");d.className="f "+CL[v];
d.innerHTML=`<div class="chip">${C[v]}</div><div><div class="n"><small>${id}</small>${n}</div><div class="s">${s}</div></div>`;
d.onclick=()=>{st[id]=((st[id]||0)+1)%3;localStorage.setItem(K,JSON.stringify(st));render()};
L.appendChild(d)});
document.getElementById("tot").textContent=`${f} fatte su ${FASI.length}`}
render();
</script></body></html>
