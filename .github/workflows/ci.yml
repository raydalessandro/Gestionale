name: CI

# Cancello di merge (non di deploy: a quello pensa Vercel).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # controllo notturno del contratto

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── build: sempre, anche sui fork (nessun segreto richiesto) ────────────────
  build:
    name: Build · typecheck · L1+L4
    runs-on: ubuntu-latest
    env:
      # Env fittizie: bastano a compilare, non toccano alcun DB reale.
      NEXT_PUBLIC_SUPABASE_URL: https://fake.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-anon-key-for-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build (Next)
        run: npm run build
      - name: L1 unit + L4 guardie
        run: npm test

  # ── guardia: i job contratto/e2e girano solo se ci sono i segreti ───────────
  guard:
    name: Segreti di test presenti?
    runs-on: ubuntu-latest
    outputs:
      secrets: ${{ steps.check.outputs.secrets }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.TEST_SUPABASE_URL }}
        run: |
          if [ -n "$URL" ]; then
            echo "secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "secrets=false" >> "$GITHUB_OUTPUT"
          fi

  # ── contratto (L2) poi E2E (L3): solo con segreti, e non su ogni push ───────
  contratto-e2e:
    name: L2 contratto · L3 e2e
    needs: [build, guard]
    if: >-
      needs.guard.outputs.secrets == 'true' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    runs-on: ubuntu-latest
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      # OPZIONALE (S0/020): connessione Postgres diretta al progetto di TEST.
      # Serve solo ai due test che ispezionano il CATALOGO (pg_class.relrowsecurity
      # su _riparazioni_dati, has_function_privilege sulle funzioni-trigger):
      # PostgREST non espone pg_catalog, nemmeno col service role. Se il segreto
      # non c'è, quei due test skippano puliti e tutto il resto gira lo stesso.
      TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      # L'app E2E parla col progetto di TEST (mai produzione).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Allineamento del DB di test PRIMA di ogni altra cosa: il repo non deve
      # mai correre più avanti del database su cui gira il contratto. È la
      # classe di rossi 125/126 (repo avanti, DB indietro) chiusa alla radice.
      # Idempotente per costruzione — `applica-migrazioni.ts` tiene il registro
      # `_infra_migrazioni` e salta ciò che è già applicato: su un progetto
      # allineato questo passo non tocca nulla e costa qualche secondo.
      #
      # Va PRIMA di `svuota-test.ts`, e non è un dettaglio d'ordine: la funzione
      # `svuota_dati_di_test()` è essa stessa figlia di una migrazione (015). Su
      # un progetto ricostruito da zero, pulire prima di migrare significa
      # chiamare una funzione che non esiste ancora.
      #
      # ⚠️ `MARCA_AMBIENTE_TEST` NON si passa qui, mai. Marcherebbe come 'test'
      # QUALUNQUE database il segreto stia puntando, e quella riga è il cancello
      # che abilita `svuota_dati_di_test()`: un segreto compilato male, una volta
      # sola, e la CI acquisirebbe il diritto di svuotare ciò che tocca. La riga
      # ('test') sul progetto di test la scrive il provisioning a mano una volta
      # (docs/ambienti.md, `scripts/migra-cloud.sh test`). Se un giorno mancasse,
      # il passo successivo si ferma — ed è esattamente il modo giusto di
      # accorgersene.
      - name: Allinea il DB di test al repo (migrazioni)
        if: ${{ env.TEST_SUPABASE_DB_URL != '' }}
        env:
          # Lo script legge `SUPABASE_DB_URL`; il segreto è e resta quello di
          # TEST. La mappatura vive QUI, in un solo passo, e non a livello di
          # job: `SUPABASE_DB_URL` non deve esistere per gli altri passi (in una
          # shell locale quel nome può puntare a prod — vedi la nota in testa a
          # `tests/contratto/bonifica-020.test.ts`).
          SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: npm run db:applica-migrazioni

      # Pulizia del residuo PRIMA del contratto: se il giro precedente è fallito
      # a metà, questo parte pulito lo stesso. La funzione si rifiuta di girare se
      # il progetto non è marcato 'test' (public.ambiente), quindi è al sicuro.
      - name: Pulisci il residuo delle prove (svuota_dati_di_test)
        run: npx tsx scripts/svuota-test.ts

      # L2 · Contratto: parla col DB di test via service/anon. Prima dell'E2E.
      - name: L2 · contratto
        run: npm run test:contratto

      # L3 · E2E: build dell'app col target di test, poi Playwright (chromium).
      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium
      - name: Build app (target di test)
        run: npm run build
      - name: L3 · e2e
        run: npm run test:e2e
        env:
          E2E_WEB_COMMAND: npm run start
      - name: Report Playwright (se fallisce)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
